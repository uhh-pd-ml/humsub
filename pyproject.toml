[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hummel-submit"
version = "0.4.3"
description = "Law-backed Hummel-2 submission frontend with autonomous Slurm job chains"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "law @ git+https://github.com/riga/law.git@release_prep",
]
authors = [
  {name = "Kasieczka group"},
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: POSIX :: Linux",
]

[project.scripts]
humsub = "hummel_submit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hummel_submit = ["worker.sh"]
