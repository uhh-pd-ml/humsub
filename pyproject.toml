[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hummel-submit"
version = "0.6.1"
description = "Law-backed Hummel-2 submission frontend with autonomous Slurm job chains"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
  "law @ git+https://github.com/riga/law.git@0a26fc508104a5ea389045d844bed5685c28d5d0",
]
authors = [
  {name = "Kasieczka group"},
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: POSIX :: Linux",
]

[project.scripts]
humsub = "hummel_submit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hummel_submit = ["worker.sh", "supervisor.sh"]
