name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "43 5 * * 1"      # weekly: catches changes in law master and in the image
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest .
      - run: python -m pytest -q tests --ignore=tests/e2e

  e2e:
    # Real Slurm configured like Hummel-2, from github.com/uhh-pd-ml/hummel-slurm-ci.
    # The container must run --privileged, which GitHub-hosted runners allow.
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - name: Pull the Hummel Slurm image
        run: docker pull ghcr.io/uhh-pd-ml/hummel-slurm-ci:latest
      - name: End-to-end tests (including the slow continuation test)
        run: tests/e2e/run.sh -x
